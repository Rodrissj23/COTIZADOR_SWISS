name: Swiss QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run logic and auth audit
        run: |
          node tests/qa.mjs
          node tests/minor-individual.mjs
          node tests/age-open-ended.mjs
          node tests/auth-qa.mjs
          node tests/edge-auth-qa.mjs
          node tests/pdf-download-resilience.mjs
          node tests/coverage-assets-qa.mjs
          node tests/intro-assets-qa.mjs
      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0 html2canvas@1.4.1 jspdf@2.5.2 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/swiss-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/swiss-http.log
          exit 1
      - name: Run browser and PDF audit
        run: |
          node tests/browser-qa.mjs
          node tests/interaction-qa.mjs
      - name: Capture visual QA artifacts
        run: node tests/visual-capture.mjs
      - name: Upload visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiss-visual-qa
          path: qa-artifacts/
          retention-days: 7
