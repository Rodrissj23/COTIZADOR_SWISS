<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d71920">
  <title>Swiss Medical · Portal comercial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand" aria-label="Presentación">
      <a class="brand brand--official brand--login" href="login.html" aria-label="Swiss Medical Medicina Privada">
        <img src="assets/images/swiss-medical-logo.svg" alt="" width="166" height="56">
      </a>
      <div class="login-copy">
        <p class="eyebrow eyebrow--white">PORTAL COMERCIAL</p>
        <h1>Una propuesta de salud, mejor presentada.</h1>
        <p>Cotizá, compará y prepará una propuesta clara para cada cliente.</p>
      </div>
      <p class="zeroka">UNA HERRAMIENTA DE <b>GRUPO ZEROKA</b></p>
    </section>
    <figure class="login-photo"><img src="assets/images/login-doctor.jpg" alt="Una asesora conversando con un médico"><figcaption>Confianza en cada decisión</figcaption></figure>
    <section class="login-card">
      <p class="eyebrow">BIENVENIDO</p>
      <h2>Ingresá al portal</h2>
      <p class="muted">Usá tus credenciales comerciales.</p>
      <form id="loginForm" autocomplete="on">
        <label>Usuario<input name="username" autocomplete="username" required></label>
        <label>Contraseña<span class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="showPassword">Ver</button></span></label>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="button button--dark button--wide" type="submit"><span>Ingresar</span><span>→</span></button>
      </form>
      <p class="login-note">Acceso exclusivo para el equipo comercial.</p>
    </section>
  </main>
  <script src="auth/login.js"></script>
</body>
</html>
